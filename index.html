 WR.forEach(o=>{const on=G[o.g][3],hit=!sel||(sel.t=='c'?(o.o.ca==sel.id||o.o.cb==sel.id):sel.w===o);
  o.o.m.visible=on;o.num=(sel&&sel.t=='c'&&hit&&on)?rows.length+1:0;const mt=o.o.m.material;mt.color.set(o.num?PAL[(o.num-1)%PAL.length]:(o.c||G[o.g][0]));mt.opacity=hit?1:(sel&&sel.t=='c'?.04:.07);mt.emissive.setHex(sel&&hit?0x333333:0);
  if(on&&hit)rows.push(o)});
 S.traverse(s=>{if(s.userData.pl)s.visible=labOn});hov=null;
 tags.forEach(t=>S.remove(t));tags=[];
 WR.forEach(o=>{if(o.num){const col=PAL[(o.num-1)%PAL.length];[o.a,o.b].forEach(r=>{const t=spr(String(o.num),46,.017,col);t.position.copy(pos[r]).add(new THREE.Vector3(0,2.8,0));S.add(t);tags.push(t)})}});
 const rel=new Set();if(sel&&sel.t=='c'){rel.add(sel.id);rows.forEach(o=>{rel.add(o.o.ca);rel.add(o.o.cb)})}
 picks.forEach(m=>{const ok=!(sel&&sel.t=='c')||rel.has(m.userData.cid);m.material.transparent=true;m.material.opacity=ok?1:.15});
 document.getElementById('info').innerHTML=sel?(sel.t=='c'?`<b>${CM[sel.id].name}</b>：${rows.length} 條線（目前顯示）`:`<b>已選 1 條線</b>`):`顯示 ${rows.length} / ${WR.length} 條線。上方可切換訊號／電源／馬達／感測／通訊。`;
 document.getElementById('list').innerHTML=rows.map(o=>`<div class="r" data-i="${WR.indexOf(o)}"><i style="background:${o.num?PAL[(o.num-1)%PAL.length]:(o.c&&o.g!='MOT'?o.c:G[o.g][0])}">${o.num||''}</i><div><b>${nmOf(o.a)}</b> → <b>${nmOf(o.b)}</b><small>${G[o.g][2]}${o.n?'・'+o.n:''}</small></div></div>`).join('')}
document.getElementById('grp').innerHTML=Object.keys(G).map(k=>`<label class="g"><input type="checkbox" data-g="${k}" ${G[k][3]?'checked':''}><i style="background:${G[k][0]}"></i><span>${G[k][2]}</span><small>${W.filter(o=>o.g==k).length}</small></label>`).join('');
document.getElementById('grp').onchange=e=>{G[e.target.dataset.g][3]=e.target.checked?1:0;refresh()};
const LS=document.getElementById('list');
LS.onclick=e=>{const r=e.target.closest('.r');if(!r)return;const o=WR[+r.dataset.i];if(sel&&sel.t=='c'){hov=hov===o?null:o;applyHov()}else{sel={t:'w',w:o};refresh()}};
LS.onmouseover=e=>{const r=e.target.closest('.r');if(sel&&sel.t=='c'){hov=r?WR[+r.dataset.i]:null;applyHov()}};
LS.onmouseleave=()=>{hov=null;applyHov()};
bLab.onclick=()=>{labOn=!labOn;bLab.classList.toggle('on',labOn);refresh()};
bTop.onclick=()=>{az=0;el=1.5;dist=120;tg.set(0,0,0);setCam()};bIso.onclick=()=>{az=.45;el=.85;dist=135;tg.set(0,0,0);setCam()};
const PRE={'訊號':['PWM','MOT','ENC','TRG','ECH','UART','I2C','SD'],'電源':['VM','V5','V33','GND'],'馬達':['PWM','MOT'],'感測':['ENC','TRG','ECH'],'通訊':['UART','I2C','SD'],'電阻電容':['PAS','VM','V33','GND','MOT','PWM','ENC','ECH'],'全部':Object.keys(G)};
function setPre(n){for(const k in G)G[k][3]=PRE[n].includes(k)?1:0;sel=null;document.querySelectorAll('#grp input').forEach(i=>i.checked=!!G[i.dataset.g][3]);document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('on',b.textContent==n));refresh()}
document.getElementById('pre').innerHTML=Object.keys(PRE).map(n=>`<button>${n}</button>`).join('');
document.getElementById('pre').onclick=e=>{if(e.target.tagName=='BUTTON')setPre(e.target.textContent)};
const ptr=new Map(),ray=new THREE.Raycaster(),tip=document.getElementById('tip');let moved=0;
function hit(e){const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);
 return ray.intersectObjects(wm.filter(m=>m.visible&&m.material.opacity>.5).concat(picks),false)[0]}
function pan(dx,dy){const s=dist*.0016;tg.x+=(-Math.cos(az)*dx-Math.sin(az)*dy)*s;tg.z+=(Math.sin(az)*dx-Math.cos(az)*dy)*s}
cv.addEventListener('pointerdown',e=>{anim=null;cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);
 if(!p){const h=hit(e);if(h&&h.object.userData.w){const o=h.object.userData.w;tip.style.display='block';tip.style.left=e.offsetX+14+'px';tip.style.top=e.offsetY+14+'px';tip.innerHTML=`<b>${G[o.g][2]}</b><br>${nmOf(o.a)} → ${nmOf(o.b)}${o.n?'<br>'+o.n:''}`}else tip.style.display='none';return}
 const dx=e.clientX-p.x,dy=e.clientY-p.y,q=[...ptr].find(([k])=>k!=e.pointerId);
 if(q){const d0=Math.hypot(p.x-q[1].x,p.y-q[1].y),d1=Math.hypot(e.clientX-q[1].x,e.clientY-q[1].y);dist=clamp(dist*d0/d1,12,320);pan(dx/2,dy/2)}
 else if(e.buttons&2||e.shiftKey||e.ctrlKey||e.metaKey)pan(dx,dy);else{az-=dx*.006;el=clamp(el+dy*.006,.08,1.56)}
 p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);setCam()});
cv.addEventListener('pointerup',e=>{if(ptr.size==1&&moved<5){const h=hit(e);sel=h?(h.object.userData.w?{t:'w',w:h.object.userData.w}:{t:'c',id:h.object.userData.cid}):null;refresh();if(sel&&sel.t=='c'){const c=CM[sel.id];anim={t:new THREE.Vector3(c.x,0,c.z),d:Math.min(dist,75)}}}ptr.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
let anim=null;
function gp(e){const r=cv.getBoundingClientRect();cam.updateMatrixWorld();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);const t=-ray.ray.origin.y/ray.ray.direction.y;return t>0?ray.ray.origin.clone().addScaledVector(ray.ray.direction,t):null}
cv.addEventListener('wheel',e=>{e.preventDefault();anim=null;const f=1+clamp(e.deltaY,-120,120)*.0012,nd=clamp(dist*f,12,320),p=gp(e);if(p){const k=1-nd/dist;tg.x+=(p.x-tg.x)*k;tg.z+=(p.z-tg.z)*k}dist=nd;setCam()},{passive:false});
cv.addEventListener('dblclick',e=>{const p=gp(e);if(p)anim={t:new THREE.Vector3(p.x,0,p.z),d:35}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();anim={t:new THREE.Vector3(0,0,0),d:135}}});
addEventListener('keyup',e=>{if(e.code=='Space')e.preventDefault()});
new ResizeObserver(()=>{const r=document.getElementById('stage').getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}).observe(document.getElementById('stage'));
setCam();setPre('訊號');(function loop(){if(anim){tg.lerp(anim.t,.18);dist+=(anim.d-dist)*.18;setCam();if(tg.distanceTo(anim.t)<.1&&Math.abs(anim.d-dist)<.3)anim=null}R.render(S,cam);requestAnimationFrame(loop)})();
</script></body></html>
