<style>

<div><h1>RC4WD 4WD 接線圖</h1>

<script>
/* ===================== 資料區：改線只動這裡 =====================

 VM:['#ff3b30',.26,'電池 VM（12V）',1],V5:['#ff9500',.2,'5V',1],V33:['#ffd60a',.16,'3V3',1],GND:['#9aa3b2',.14,'GND 共地',0],

 TRG:['#40c8e0',.14,'超音波 Trig',1],ECH:['#bf5af2',.14,'超音波 Echo（經分壓）',1],UART:['#ff2d95',.16,'UART 對接',1],I2C:['#7ee787',.14,'I2C 電量計＋六軸（INA219 / LSM6DS3）',1],SD:['#00d4aa',.14,'microSD 記憶卡（SD_MMC 1-bit）',1],
 PAS:['#ffb86b',.12,'被動元件（電阻/電容）',1]};
const LP=['GP0','GP1','GND','GP2','GP3','GP4','GP5','GND','GP6','GP7','GP8','GP9','GND','GP10','GP11','GP12','GP13','GND','GP14','GP15'];

const pp=(a,left)=>a.map((n,i)=>{const p=left?i+1:40-i;return(n=='GND'?n+p:n)+'|'+n+'·'+p});
const C=[
 {id:'PICO',name:'Pico RP2040',x:0,z:0,w:6,h:.8,d:20,col:'#2e8b57',pins:{L:pp(LP,1),R:pp(RP,0)}},
 {id:'ESP',name:'ESP32-S3',x:0,z:-20,w:18,h:1,d:12,col:'#37474f',p:1.7,pins:{B:['5V','GND','TX|GPIO1 TX','RX|GPIO2 RX','3V3','SDA|GPIO41 SDA','SCL|GPIO42 SCL','SDCLK|GPIO39 SD_CLK','SDCMD|GPIO38 SD_CMD','SDD0|GPIO40 SD_D0']}},
 {id:'SD',name:'microSD（ESP32-S3 板載插槽）',x:-17,z:-11,w:7,h:1,d:3,col:'#00695c',p:2,pins:{R:['CLK','CMD','D0']}},
 {id:'IMU',name:'LSM6DS3 六軸',x:22.5,z:-23.5,w:5.5,h:1,d:4,col:'#ad1457',pins:{L:['VCC','GND','SDA','SCL','SA0|SA0→GND']},p:.75},
 {id:'INA',name:'INA219 電量計',x:22,z:-12,w:8,h:1,d:5,col:'#6a1b9a',pins:{L:['VCC','GND','SDA','SCL'],R:['VIN-|VIN− 接電池+']}},
 {id:'BATT',name:'3S 電池',x:-40,z:8,w:7,h:4,d:14,col:'#e0a100',p:2,pins:{R:['+','-|−']}},
 {id:'SWF',name:'開關+保險絲',x:-29,z:8,w:6,h:1.2,d:5,col:'#8d6e63',pins:{L:['IN'],R:['OUT']}},
 {id:'PB',name:'5V 行動電源',x:40,z:8,w:7,h:4,d:14,col:'#6d4c41',p:2,pins:{L:['5V','GND']}},
 {id:'D1',name:'1N5819',x:7,z:7.5,w:4,h:1,d:2,col:'#546e7a',pins:{L:['A|A 陽極'],R:['K|K 陰極']}},
 {id:'VM',bus:1,name:'VM 匯流',x:-25,z:15,col:'#ff3b30'},{id:'GND',bus:1,name:'GND 匯流',x:0,z:12,col:'#78818f'},
 {id:'V33',bus:1,name:'3V3 匯流',x:0,z:17.5,col:'#e6b800'},{id:'V5',bus:1,name:'5V 匯流',x:9,z:22.5,col:'#ff9500'},
 {id:'V33E',bus:1,name:'ESP 3V3 匯流',x:31,z:-12,col:'#e6b800'},{id:'SDAB',bus:1,name:'I2C SDA 匯流',x:14,z:-17,col:'#7ee787'},{id:'SCLB',bus:1,name:'I2C SCL 匯流',x:14,z:-20,col:'#7ee787'},
 {id:'RPSDA',name:'SDA 上拉 4.7kΩ(選用)',x:19,z:-16,w:2.4,h:1,d:2.4,col:'#c2b280',pins:{L:['1|→SDA'],R:['2|→3V3']}},
 {id:'RPSCL',name:'SCL 上拉 4.7kΩ(選用)',x:19,z:-19.5,w:2.4,h:1,d:2.4,col:'#c2b280',pins:{L:['1|→SCL'],R:['2|→3V3']}}];
const tb=(id,nm,x,inn,out)=>C.push({id,name:nm,x,z:-2,w:6,h:1,d:9,col:'#c0392b',pins:{[inn]:['PWMA','AIN1','AIN2','PWMB','BIN1','BIN2','STBY','VCC'],[out]:['AO1','AO2','BO1','BO2','VM','GND']}});
tb('TB1','TB6612 #1 左側',-16,'R','L');tb('TB2','TB6612 #2 右側',16,'L','R');
// 每輪：驅動板/通道、[PWM,IN1,IN2]、編碼器A相、[Trig,Echo]、馬達位置/針腳側、超音波位置/針腳側
const WH={FL:{tb:'TB1',ch:'A',m:[0,1,2],e:12,s:[13,15],x:-31,z:-22,ms:'R',sx:-12,sz:-33,sb:'B'},
 RL:{tb:'TB1',ch:'B',m:[3,4,5],e:16,s:[22,26],x:-31,z:22,ms:'R',sx:-12,sz:33,sb:'F'},
 FR:{tb:'TB2',ch:'A',m:[6,7,8],e:14,s:[17,19],x:31,z:-22,ms:'L',sx:12,sz:-33,sb:'B'},
 RR:{tb:'TB2',ch:'B',m:[9,10,11],e:18,s:[27,28],x:31,z:22,ms:'L',sx:12,sz:33,sb:'F'}};
const W=[],w=(a,b,g,n,c)=>W.push({a,b,g,n:n||'',c});
for(const k in WH){const o=WH[k],A=o.ch,P=[A=='A'?'PWMA':'PWMB',A+'IN1'.replace('AIN1',A=='A'?'AIN1':'BIN1'),A=='A'?'AIN2':'BIN2'];
 C.push({id:k,name:k+' 馬達 GA25',x:o.x,z:o.z,w:9,h:4,d:7,col:'#455a64',pins:{[o.ms]:['M+|紅 M+','M-|白 M−','VCC|藍 VCC','GND|黑 GND','A|黃 A','B|綠 B（不接）']}});
 C.push({id:'S'+k,name:k+' 超音波',x:o.sx,z:o.sz,w:9,h:1.6,d:3,col:'#1565c0',p:2,pins:{[o.sb]:['VCC','Trig','Echo','GND']}});
 C.push({id:'D'+k,name:k+' Echo 分壓 R1 1kΩ+R2 2kΩ',x:o.sx,z:o.sz+(o.sz<0?7:-7),w:5,h:.8,d:2,col:'#795548',pins:{L:['IN|Echo 5V'],R:['OUT|→Pico'],B:['GND|R2 2k(2×1k)→GND']}});
 w(`PICO.GP${o.m[0]}`,`${o.tb}.${P[0]}`,'PWM','PWM 20kHz');w(`PICO.GP${o.m[1]}`,`${o.tb}.${P[1]}`,'PWM','IN1');w(`PICO.GP${o.m[2]}`,`${o.tb}.${P[2]}`,'PWM','IN2');
 w(`${o.tb}.${A}O1`,`${k}.M+`,'MOT','紅線','#ff453a');w(`${o.tb}.${A}O2`,`${k}.M-`,'MOT','白線','#f2f2f7');
 w(`${k}.A`,`PICO.GP${o.e}`,'ENC','黃線 A 相；B 相不接');w(`V33.E${k}`,`${k}.VCC`,'V33','編碼器 3.3V');w(`${k}.GND`,`GND.E${k}`,'GND');
 w(`PICO.GP${o.s[0]}`,`S${k}.Trig`,'TRG');w(`S${k}.Echo`,`D${k}.IN`,'ECH','Echo 為 5V，先分壓');w(`D${k}.OUT`,`PICO.GP${o.s[1]}`,'ECH','分壓後約 3.3V');
 w(`D${k}.GND`,`GND.D${k}`,'GND','R2 = 2 顆 1kΩ 串聯 → GND');w(`V5.S${k}`,`S${k}.VCC`,'V5');w(`S${k}.GND`,`GND.S${k}`,'GND');
 // ---- 被動元件（並聯在既有線路上，線組 PAS；不佔用針腳）----
 C.push({id:'CM'+k,name:k+' 馬達電容 0.1µF',x:o.x<0?o.x-9:o.x+9,z:o.z,w:2.4,h:1.2,d:4,col:'#d9a441',pins:{[o.ms=='R'?'L':'R']:['1|M+','2|M−']},p:2.2});
 C.push({id:'RD'+k,name:k+' 下拉 10kΩ×3',x:o.x<0?o.x-9:o.x+9,z:o.z+(o.z<0?-8:8),w:2.4,h:1,d:7,col:'#c2b280',pins:{[o.ms=='R'?'L':'R']:['1|PWM','2|IN1','3|IN2','G|GND']},p:1.6});
 C.push({id:'RE'+k,name:k+' 編碼器上拉 4.7kΩ(選用)',x:o.x<0?o.x-9:o.x+9,z:o.z+(o.z<0?8:15),w:2.4,h:1,d:4,col:'#c2b280',pins:{[o.ms=='R'?'L':'R']:['1|→A 線','2|→3V3']},p:2.2});
 w(`CM${k}.1`,`${k}.M+`,'PAS','並聯在馬達 M+/M− 端子，越近越好');w(`CM${k}.2`,`${k}.M-`,'PAS');
 w(`RD${k}.1`,`${o.tb}.${P[0]}`,'PAS','10k 下拉到 GND（重啟瞬間不亂轉）');w(`RD${k}.2`,`${o.tb}.${P[1]}`,'PAS');w(`RD${k}.3`,`${o.tb}.${P[2]}`,'PAS');w(`RD${k}.G`,`GND.RD${k}`,'GND');
 w(`RE${k}.1`,`${k}.A`,'PAS','選用：A 線邊緣圓鈍時再加；Pico 已開內部上拉');w(`RE${k}.2`,`V33.RE${k}`,'V33');}
for(const t of['TB1','TB2']){w(`V33.${t}V`,`${t}.VCC`,'V33');w(`V33.${t}S`,`${t}.STBY`,'V33','STBY 接 3V3 常開');w(`VM.${t}`,`${t}.VM`,'VM','VM 旁並 1000µF');w(`${t}.GND`,`GND.${t}`,'GND');
 C.push({id:'CT'+t,name:t+' 電解電容 1000µF/25V',x:t=='TB1'?-16:16,z:7,w:3.6,h:3,d:3.6,col:'#1a237e',pins:{L:['+'],R:['-|−']},p:1});
 w(`VM.CT${t}`,`CT${t}.+`,'VM','電容 + 接 VM（靠近驅動板，注意極性）');w(`CT${t}.-`,`GND.CT${t}`,'GND','電容 − 接 GND（長腳為 +）')}

 ['esp','ESP32-S3 開發板（含 OV2640 鏡頭、microSD 插槽）',1,'must','Wi-Fi／網頁／鏡頭／錄製；SD 腳位須為 GPIO38/39/40 (1-bit)，例如 ESP32-S3-CAM 類'],
 ['tb','TB6612FNG 馬達驅動板',2,'must','左側一塊、右側一塊，各管 2 輪'],
 ['mot','GA25 減速馬達（帶編碼器）',4,'must','6 線：M+ M− VCC GND A B；B 相不接。車體若已有馬達先確認型號'],
 ['son','HC-SR04 超音波模組',4,'must','車頭 2、車尾 2'],
 ['sd','microSD 卡',1,'must','16–32GB、FAT32、Class 10 以上'],
 ['ina','INA219 電量計模組',1,'rec','手機顯示電池電量；只量電壓，不串聯馬達電流'],
 ['imu','LSM6DS3 六軸模組（SA0 接 GND = 0x6A）',1,'opt','錄製分析用；沒裝韌體也能正常運作']]],
['電源',[
 ['bat','3S 鋰電池（11.1V，XT60）',1,'must','馬達電源'],
 ['pb','5V 行動電源',1,'must','供 Pico / ESP32 / 超音波'],
 ['xt60','XT60 公母頭',1,'must','一組，接電池'],
 ['sw','總開關',1,'must','裝在電池正極後'],
 ['fuse','保險絲 5–7.5A 與座',1,'must','一定要裝，短路保護'],
 ['d','1N5819 蕭特基二極體',1,'must','1 顆（接線圖 D1）'],
 ['cap1000','1000µF / 25V 電解電容',2,'must','每塊驅動板 VM 旁一顆，注意極性（長腳 +）'],
 ['cap01','0.1µF 陶瓷電容',4,'must','每顆馬達端子間一顆，越近馬達越好']]],
['電阻（1/4W）',[
 ['r1k','1kΩ 電阻',12,'must','4 顆 Echo 分壓：每顆 R1 用 1 顆、R2 用 2 顆串聯'],
 ['r10k','10kΩ 電阻',12,'must','每輪 3 顆下拉（PWM / IN1 / IN2）'],
 ['r47','4.7kΩ 電阻',6,'opt','編碼器上拉 4 + I2C 上拉 2；多數情況不用裝']]],
['配線與耗材',[
 ['wp','粗電線 18–20AWG（紅／黑）',1,'must','電源主幹，數公尺'],
 ['ws','細電線 24–26AWG（多色）',1,'must','訊號線'],
 ['dup','杜邦線 / 排針 / 洞洞板或轉接板',1,'must','連接用，建議多買'],
 ['hs','熱縮套管、焊錫、助焊劑',1,'must',''],
 ['usb','USB 資料線（Micro-USB 給 Pico、Type-C 給 ESP32-S3）',2,'must','燒錄用，要有資料傳輸功能']]],
['工具',[
 ['dmm','萬用表',1,'tool','焊接前量電池極性、量電壓、查短路'],
 ['iron','電烙鐵與焊台',1,'tool','']]]];

const BPIN={pico:'PICO',esp:'ESP',tb:'TB1',mot:'FL',son:'SFL',sd:'SD',ina:'INA',imu:'IMU',bat:'BATT',pb:'PB',sw:'SWF',d:'D1'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pinsOf(id){const c=C.find(x=>x.id===BPIN[id]);if(!c||!c.pins)return null;const out=[];for(const k of Object.keys(c.pins))for(const p of c.pins[k]){const l=p.includes('|')?p.split('|')[1]:p;out.push(l)}return out}
const bAll=()=>BOM.flatMap(g=>g[1].map(i=>({g:g[0],id:i[0],name:i[1],q:i[2],lv:i[3],n:i[4]})));
const bSave=()=>{try{const c={};for(const k in BS){const v=BS[k];if(v.b||v.s||v.n)c[k]=v}localStorage.setItem(BKEY,JSON.stringify(c))}catch(e){}};
let BF='all';
function bRender(){
 const all=bAll(),got=all.filter(i=>BS[i.id]&&BS[i.id].b).length,must=all.filter(i=>i.lv==='must'),mg=must.filter(i=>BS[i.id]&&BS[i.id].b).length;
 document.getElementById('bsum').textContent=`已備齊 ${got}/${all.length} 項；必買 ${mg}/${must.length} 項`;
 document.querySelector('#bbar i').style.width=(100*got/all.length)+'%';
 let h='';for(const g of BOM){const L=g[1].filter(it=>{const st=BS[it[0]]||{};return BF==='all'||(BF==='must'&&it[3]==='must')||(BF==='todo'&&!st.b)});if(!L.length)continue;
  h+=`<h3>${g[0]}</h3><div class="pgrid">`;
  for(const it of L){const st=BS[it[0]]||{},pins=pinsOf(it[0]);
   const chips=pins?`<div class="pins">${pins.map(p=>`<span class="${/^(VM|VCC|5V|3V3|VBUS|VSYS|VIN|\+|3V3_EN|ADC_VREF)/.test(p)?'pw':/^GND|^-|^−/.test(p)?'gd':''}">${esc(p)}</span>`).join('')}</div>`:'';
   h+=`<div class="pc${st.b?' dn':''}"><div class="t"><input type="checkbox" data-b="${it[0]}" ${st.b?'checked':''} title="已買"><b>${esc(it[1])}</b><span class="q">×${it[2]}</span></div><span class="lv" style="background:${BL[it[3]][1]}">${BL[it[3]][0]}</span>${it[4]?`<div class="d">${esc(it[4])}</div>`:''}${chips}<input class="bn" data-n="${it[0]}" placeholder="備註（型號 / 店家 / 價格）" value="${esc(st.n||'')}"></div>`}
  h+='</div>'}
 document.getElementById('blist').innerHTML=h||'<div class="mu">沒有符合的項目</div>'}
document.getElementById('blist').addEventListener('change',e=>{const t=e.target;if(t.dataset.b){(BS[t.dataset.b]=BS[t.dataset.b]||{}).b=t.checked?1:0;bSave();bRender()}});
document.getElementById('blist').addEventListener('input',e=>{const t=e.target;if(t.dataset.n){(BS[t.dataset.n]=BS[t.dataset.n]||{}).n=t.value;bSave()}});
document.getElementById('bSel').onchange=e=>{BF=e.target.value;bRender()};
document.getElementById('bClr').onclick=()=>{if(confirm('清除全部勾選與備註？（建議先匯出）')){BS={};bSave();bRender()}};
document.getElementById('bCsv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['分類','品名','數量','必要性','說明','已買','備註']];
 bAll().forEach(i=>{const s=BS[i.id]||{};rows.push([i.g,i.name,i.q,BL[i.lv][0],i.n,s.b?'V':'',s.n||''])});
 download('rc4wd-bom-'+stamp()+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')};
document.getElementById('bJson').onclick=()=>{const items={};for(const k in BS){const v=BS[k];if(v.b||v.s||v.n)items[k]={b:v.b?1:0,n:v.n||''}}
 download('rc4wd-bom-'+stamp()+'.json',JSON.stringify({app:'rc4wd-bom',ver:1,exported:new Date().toISOString(),items},null,1),'application/json')};
document.getElementById('bImpB').onclick=()=>document.getElementById('fBom').click();
document.getElementById('fBom').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(j.app!=='rc4wd-bom'||!j.items)throw Error('不是零件清單檔');
 const ids=new Set(bAll().map(i=>i.id));BS={};for(const k in j.items)if(ids.has(k))BS[k]={b:j.items[k].b?1:0,n:String(j.items[k].n||'')};bSave();bRender()}catch(err){alert('匯入失敗：'+err.message)}};fr.readAsText(f)};
bRender();

/* ---- 分頁切換 + 右側可拖曳寬度 ---- */
function showTab(p){document.body.classList.toggle('pv',p);document.getElementById('tW').classList.toggle('on',!p);document.getElementById('tP').classList.toggle('on',p);try{localStorage.setItem('rc4wd_tab',p?'p':'w')}catch(e){}if(p)bRender()}
document.getElementById('tW').onclick=()=>showTab(false);document.getElementById('tP').onclick=()=>showTab(true);
(function(){const rz=document.getElementById('rz'),root=document.documentElement;let w=0;
 const setW=v=>{w=Math.max(230,Math.min(innerWidth*0.75,v));root.style.setProperty('--aw',w+'px')};
 try{const v=+localStorage.getItem('rc4wd_aside_w');if(v)setW(v)}catch(e){}
 rz.addEventListener('pointerdown',e=>{rz.setPointerCapture(e.pointerId);rz.classList.add('on');document.body.classList.add('drag');
  const mv=ev=>setW(innerWidth-ev.clientX-3);
  const up=()=>{rz.classList.remove('on');document.body.classList.remove('drag');rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up);rz.removeEventListener('pointercancel',up);try{localStorage.setItem('rc4wd_aside_w',String(Math.round(w)))}catch(e){}};
  rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up);rz.addEventListener('pointercancel',up)});
 rz.addEventListener('dblclick',()=>{setW(310);try{localStorage.removeItem('rc4wd_aside_w')}catch(e){}});
})();
try{if(localStorage.getItem('rc4wd_tab')==='p')showTab(true)}catch(e){}
</script></body></html>
